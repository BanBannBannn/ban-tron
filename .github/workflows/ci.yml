# CI: mỗi lần push / mở Pull Request → lint, kiểm tra kiểu, rồi chạy TOÀN BỘ test
# (unit + bảo mật + e2e 2 trình duyệt) trên Supabase local dựng ngay trong máy CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - name: Audit dependencies (lỗ hổng mức high trở lên)
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Tests (unit + security + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.95.4
      - name: Start Supabase local (áp dụng migrations)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Write .env.local
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } > .env.local

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

# CD cho database: đẩy migrations mới lên Supabase cloud.
# Chỉ chạy khi đã khai báo 3 secret trong GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   (mật khẩu DB của project)
#   SUPABASE_PROJECT_ID    (project ref, vd. abcdefghijklmnop)
# Frontend do Vercel tự deploy khi push lên main (Git integration), không cần workflow riêng.
name: Deploy database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Chỉ đẩy migration sau khi CI xanh: bật "Require status checks" cho nhánh main trên GitHub
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Chưa cấu hình secret Supabase → bỏ qua deploy DB."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: supabase/setup-cli@v3
        if: steps.check.outputs.skip != 'true'
        with:
          version: 2.95.4
      - name: Push migrations
        if: steps.check.outputs.skip != 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
